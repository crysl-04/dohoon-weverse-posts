<style>
:root{
  --background:#f5f7f8; --foreground:#182026; --card:#ffffff; --card-foreground:#182026;

  --primary:#0e9f94; --primary-foreground:#ffffff;
  --blue:#2f7fd1; --green:#12a678; --red:#d64545;
  --viz-series-1:#0e9f94; --accent:#e6f5f3; --accent-foreground:#0b5c57;
}
@media (prefers-color-scheme: dark){
  :root{
    --background:#12161a; --foreground:#e8edf0; --card:#1a2126; --card-foreground:#e8edf0;
    --muted:#242d33; --muted-foreground:#9aa8b1; --border:#2c363d; --input:#2c363d; --ring:#35c9bc;
    --primary:#2bb8ad; --primary-foreground:#07211f;
    --blue:#5aa2e8; --green:#3ecf9a; --red:#e06c6c;
    --viz-series-1:#35c9bc; --accent:#1d2b29; --accent-foreground:#9fe0d8;
  }
}
*{box-sizing:border-box}
body{margin:0 auto;padding:28px 16px 48px;max-width:880px;background:var(--background);color:var(--foreground);font:400 14px/1.65 'Noto Sans KR','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}
h1{font-size:22px;font-weight:700;line-height:1.3;margin:0}
h3{font-size:15px;font-weight:500;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.text-small{font-size:12px}
.text-muted{color:var(--muted-foreground)}
.tabular-nums{font-variant-numeric:tabular-nums}
.viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.viz-stat-value{font-size:26px;font-weight:500;line-height:1.2;margin:2px 0}
.viz-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form-control{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--foreground);font:inherit}
.form-control:focus{outline:2px solid var(--ring);outline-offset:1px}
.btn{height:32px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font:inherit;cursor:pointer}
.btn:hover{background:var(--muted)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav-link{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font:inherit;font-size:13px;cursor:pointer}
.nav-link.active{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
#dp-tip{position:fixed;z-index:99;display:none;pointer-events:none;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.dp-foot{margin-top:26px;text-align:center;font-size:12px;color:var(--muted-foreground)}
.dp-foot a{color:var(--muted-foreground)}

    s += '<line x1="' + pl + '" y1="' + (h - pb) + '" x2="' + (w - pr) + '" y2="' + (h - pb) + '" stroke="var(--border)" stroke-width="1"/>';
    s += '<text x="4" y="' + (pt + 10) + '" fill="var(--muted-foreground)" font-size="11">' + maxN + '</text>';
    s += '<text x="4" y="' + (h - pb) + '" fill="var(--muted-foreground)" font-size="11">0</text>';
    months.forEach(function (d, i) {
      var bh = Math.max(Math.round((h - pt - pb - 2) * d.n / maxN), d.n ? 2 : 0);
      var x = pl + i * bw;
      var y0 = h - pb - bh;
      s += '<rect data-chart-hit="bar" data-tooltip="' + d.label + ' · ' + d.n + ' 条" x="' + (x + 1.5).toFixed(1) + '" y="' + y0 + '" width="' + Math.max(bw - 3, 2).toFixed(1) + '" height="' + bh + '" rx="2" fill="var(--viz-series-1)" opacity="' + (d.n === maxN ? 1 : 0.75) + '"></rect>';
      if (d.k.slice(5) === "01" || i === months.length - 1) {
        s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" fill="var(--muted-foreground)" font-size="11">' + d.k.slice(0, 4) + "." + parseInt(d.k.slice(5), 10) + '</text>';
        if (i > 0) s += '<line x1="' + x.toFixed(1) + '" y1="' + pt + '" x2="' + x.toFixed(1) + '" y2="' + (h - pb) + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>';
      }
    });
    s += "</svg>";
    svgBox.innerHTML = s;
  }

  function badgeHtml(p) {
    var out = "";
    if (p[4] === "私密") out += '<span class="dp-badge"><i data-lucide="lock" aria-hidden="true"></i>私密帖</span>';
    else if (p[4].indexOf("HD") === 0) out += '<span class="dp-badge"><i data-lucide="video" aria-hidden="true"></i>视频' + (p[4].length > 2 ? " " + p[4].slice(3) : "") + "</span>";
    else if (p[4]) out += '<span class="dp-badge"><i data-lucide="images" aria-hidden="true"></i>附媒体 ' + p[4] + "</span>";
    return out;
  }

  function postHtml(p, idx) {
    var text = p[4] === "私密"
      ? '<p class="dp-post-text text-muted">（私密帖，需相应权限才能查看正文）</p>'
      : (p[3] ? '<p class="dp-post-text">' + esc(p[3]) + "</p>" : '<p class="dp-post-text text-muted">（无文字，仅媒体）</p>');
    var gloss = p[7] ? '<div class="dp-gloss">〔译〕' + esc(p[7]) + "</div>" : "";
    return '<div class="dp-item"><article class="card">' +
      '<div class="dp-meta"><span class="tabular-nums"><strong style="color:var(--foreground);font-weight:500">' + p[0] + "." + p.mm + "." + p.dd + "</strong> " + p[2] + " · 倒数第 " + (P.length - idx) + " 帖</span>" +
      '<span class="dp-badges">' + badgeHtml(p) + '<span style="display:inline-flex;align-items:center;gap:3px"><i data-lucide="heart" aria-hidden="true"></i>' + p[5] + '</span><span style="display:inline-flex;align-items:center;gap:3px"><i data-lucide="message-circle" aria-hidden="true"></i>' + p[6] + "</span></span></div>" +
      text + gloss + "</article></div>";
  }

  function filtered() {
    return P.filter(function (p) {
      if (year !== "all" && String(p[0]) !== year) return false;
      if (q) {
        var hay = (p[3] + " " + (p[7] || "") + " " + p[0] + "." + p.mm + "." + p.dd + " " + p[2]).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function render() {
    var fl = filtered();
    var html = "";
    var lastMonth = "";
    var n = Math.min(shown, fl.length);
    for (var i = 0; i < n; i++) {
      var p = fl[i];
      var mk = p[0] + "." + p.mm;
      if (mk !== lastMonth) {
        lastMonth = mk;
        var cnt = 0;
        fl.forEach(function (x) { if (x[0] + "." + x.mm === mk) cnt++; });
        html += '<div class="dp-month"><h3>' + p[0] + "年" + parseInt(p.mm, 10) + "月</h3><span class=\"text-small text-muted\">" + cnt + " 条</span></div>";
      }
      html += postHtml(p, P.indexOf(p));
    }
    if (!n) html = '<div class="dp-empty"><i data-lucide="search-x" aria-hidden="true" style="width:28px;height:28px"></i><p>没有匹配的帖子</p></div>';
    listEl.innerHTML = html;
    countEl.textContent = "已显示 " + n + " / " + fl.length + " 条" + (q ? "（搜索：" + q + "）" : "");
    moreBtn.style.display = n < fl.length ? "" : "none";
    moreBtn.textContent = "显示更多（还有 " + (fl.length - n) + " 条）";
    if (window.lucide) window.lucide.createIcons({ attrs: { width: 13, height: 13 } });
  }

  searchEl.addEventListener("input", function () {
    q = searchEl.value.trim().toLowerCase();
    shown = LIMIT;
    render();
  });
  moreBtn.addEventListener("click", function () {
    shown += LIMIT;
    render();
  });
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      year = b.getAttribute("data-year");
      tabs.forEach(function (x) {
        var on = x === b;
        x.classList.toggle("active", on);
        x.setAttribute("aria-selected", String(on));
      });
      shown = LIMIT;
      render();
    });
  });

  drawChart();
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(function () { drawChart(); }).observe(svgBox);
  }
  render();
})();
</script>

<div id="dp-tip" role="tooltip"></div>
<script>
(function () {
  var tip = document.getElementById("dp-tip");
  function show(el) {
    tip.textContent = el.getAttribute("data-tooltip");
    tip.style.display = "block";
    var r = el.getBoundingClientRect();
    var x = Math.min(Math.max(r.left + r.width / 2 - tip.offsetWidth / 2, 8), window.innerWidth - tip.offsetWidth - 8);
    var y = r.top - tip.offsetHeight - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hide() { tip.style.display = "none"; }
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest("[data-tooltip]");
    if (el) show(el);
  });
  document.addEventListener("mouseout", function (e) {
    if (e.target.closest("[data-tooltip]")) hide();
  });
  document.addEventListener("focusin", function (e) {
    var el = e.target.closest("[data-tooltip]");
    if (el) show(el);
  });
  document.addEventListener("focusout", hide);
  document.addEventListener("touchstart", function (e) {
    var el = e.target.closest("[data-tooltip]");
    if (el) { show(el); e.stopPropagation(); }
    else hide();
  }, { passive: true });
  window.addEventListener("load", function () {
    if (window.lucide) window.lucide.createIcons({ attrs: { width: 13, height: 13 } });
  });
})();
</script>
